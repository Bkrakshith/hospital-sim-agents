[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wardzero-agents"
version = "0.1.0"
description = "LLM-driven simulated hospital visitors for the WardZero hospital simulator"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.40",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "aiohttp",
    "keyring",
    "defusedxml",
    # the SDK HTTP client decodes brotli responses with output_buffer_limit (Brotli 1.2+);
    # Ubuntu 22.04 ships python3-brotli 1.0.9, which fails every API call
    "Brotli>=1.2",
]

[project.optional-dependencies]
embed = ["fastembed"]
voice = ["piper-tts==1.8.0", "imageio-ffmpeg"]  # spoken voices in recorded runs; models: scripts/fetch_voices.py
test = ["pytest>=8", "pytest-asyncio"]

[project.scripts]
hhumans = "wardzero_agents.cli:main"

[tool.setuptools.packages.find]
include = ["wardzero_agents*"]

[tool.setuptools.package-data]
"wardzero_agents.panel" = ["static/*.html"]
"wardzero_agents.studio" = ["static/*.html", "static/*.css", "static/*.js", "static/pages/*.js"]
"wardzero_agents.bench" = ["templates/*.html"]
"wardzero_agents.voice" = ["_piper_runner.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# ROS 2 Humble ships pytest plugins that break pytest 8+; they are not needed here
addopts = "-p no:launch_ros -p no:launch_testing"
testpaths = ["tests"]
markers = [
    "ros: needs a sourced ROS 2 Humble environment",
    "isaac: boots Isaac Sim (skipped unless WARDZERO_ISAAC=1)",
    "voice: needs Piper and the voice models (skipped when they are missing)",
]
