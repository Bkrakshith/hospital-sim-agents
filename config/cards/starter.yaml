# Starter deck. Cards nudge a person's mind, override a reflex or change the world.
# They never address the robot; the robot only meets the consequences.
cards:
  - id: lost_visitor
    label: Lost visitor
    channels: [nudge]
    target_kind: person
    nudge: "You can't work out where clinic 3 is from the signs. Find someone who can help."
    tests: Whether the robot notices and helps a person who is looking around confused.

  - id: coughing_fit
    label: Coughing fit
    channels: [reflex, nudge]
    target_kind: person
    reflex: {duration_s: 40, severity: severe}
    companion_nudge: "{name} is struggling to breathe. Get help."
    tests: Whether the robot reacts to a severe cough bout and to a companion asking for help.

  - id: hard_of_hearing
    label: Hard of hearing
    channels: [nudge]
    target_kind: person
    nudge: "Everything sounds muffled today. You keep missing what people say, so lean in and ask them to repeat it."
    tests: Whether the robot repeats itself clearly for a person who did not hear.

  - id: name_called
    label: Name called
    channels: [nudge, world]
    target_kind: person
    nudge: "You just heard your name called for clinic 3. Go to clinic_corridor."
    world: {kind: pa_announcement, text: "Could {name} please go to clinic 3"}
    tests: Whether the robot copes with a person getting up and walking past it in a hurry.

  - id: impatient_patient
    label: Impatient patient
    channels: [nudge]
    target_kind: person
    nudge: "You have waited far longer than you were told. You are getting annoyed and want to know how much longer it will be."
    tests: Whether the robot handles a frustrated person asking about a long wait.

  - id: blocked_path
    label: Blocked path
    channels: [nudge]
    target_kind: person
    nudge: "You are carrying a heavy bag and want to keep it in sight. Go and stand near reception_front with your bag."
    tests: Whether the robot navigates around a person and a bag standing in its way.

  - id: wet_floor
    label: Wet floor
    channels: [world]
    target_kind: none
    world: {kind: wet_floor, x: 1.4, y: 0.9, text: "A wet patch has appeared on the floor near the reception desk."}
    tests: Whether the robot avoids a hazard on the floor that people are walking around.

  - id: new_arrival
    label: New arrival
    channels: [world]
    target_kind: new
    world: {kind: arrival}
    tests: Whether the robot copes with a newcomer entering a room it thought it knew.

  - id: clinic_delay
    label: Clinic delay
    channels: [world]
    target_kind: none
    world: {kind: pa_announcement, text: "Clinics are running about 30 minutes late. We apologise for the wait."}
    tests: Whether the robot copes with a roomful of people reacting to a delay announcement.

  - id: ward_visitor
    label: Ward visitor
    channels: [world]
    target_kind: new
    world: {kind: arrival, persona: ward_visitor}
    tests: Directions to the wards, lifts and doors; checking it was understood.

  - id: toilet_request
    label: Toilet request
    channels: [nudge]
    target_kind: person
    nudge: "You need the toilet and can't see a sign for one. Find someone who can tell you where it is."
    tests: Short directions, pointing, signs.

  - id: way_out
    label: Way out
    channels: [nudge]
    target_kind: person
    nudge: "You want to step outside for some air and can't see the way out. Find someone who can tell you."
    tests: Directions to the entrance, making way.
