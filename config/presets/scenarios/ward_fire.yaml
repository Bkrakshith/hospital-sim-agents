id: ward_fire
title: Ward fire
prompt: >-
  A small fire starts in the ward corridor while staff move patients to the next compartment.
  The robot must put the fire out without getting in the way of the evacuation.
focus_rooms: [Ward_Corridor, B1, B2, B3, B4, B5, B6]
known_places: [Ward_Corridor, Ward_Entrance, ward_doors, nurse_base_ward, B3, B4]
duration_min: 8
robot_brief:
  role: ward fire responder
  job: Put out the small fire in the corridor. Keep clear of staff moving patients, and never block an escape route.
  equipment: You carry your own extinguisher, so you do not need to pick one up; the wall extinguisher is for staff. Use extinguish on the fire directly.
  first_contact: false
staff_line: >-
  The robot is the ward's fire responder: it puts out a small fire with its own extinguisher while you move the
  patients.
robot_start: {x: 19.0, y: 9.0, yaw: 1.5708}
characters:
  - {id: N1, name: Sarah Walker, sex: female, age_band: 31-50, role: ward_nurse, mood: stressed, room: Ward_Corridor, x: 19.0, y: 20.0, yaw: -1.5708,
     role_prompt: "You are a ward nurse on the afternoon round, checking and turning the patients in bays B1 to B3 and writing up their charts. If a fire starts, your job is the patients: move those nearest the fire to the next compartment. The robot puts the fire out, so you fight it only if the robot asks you to, or if no robot is spraying it and it is spreading towards a patient. [inferred from HTM 05-02]"}
  - {id: N2, name: Thomas Hill, sex: male, age_band: 18-30, role: ward_nurse, mood: stressed, room: Ward_Corridor, x: 19.0, y: 24.0, yaw: -1.5708,
     role_prompt: "You are a ward nurse on the afternoon round, doing the observations and fluid charts for the patients in bays B4 to B6. If a fire starts, your job is the patients: move those nearest the fire to the next compartment. The robot puts the fire out, so you fight it only if the robot asks you to, or if no robot is spraying it and it is spreading towards a patient. [inferred from HTM 05-02]"}
  - {id: P1, name: Ruth Davies, sex: female, age_band: 71+, role: patient, mood: anxious, room: B3, x: 25.109, y: 16.204, yaw: 1.571, bed: B3}
objects:
  - {kind: extinguisher, id: ext_1, label: wall extinguisher, x: 18.5, y: 10.5, z: 0.9}
timeline:
  # The alarm and the evacuation start with the fire, so the robot fights it while the nurses move patients past it.
  - {id: b1, at: "t+00:30", card: fire_start, params: {x: 19.0, y: 14.5}}
  - {id: b2, at: "t+00:30", card: alarm, params: {x: 19.0, y: 14.5}}
  - {id: b3, at: "t+00:30", card: staff_evacuate, target: N1}
  - {id: b4, at: "t+00:30", card: staff_evacuate, target: N2}
criteria:
  - {id: out, label: Robot puts the fire out within 2 minutes, metric: fire_out_by_robot_s, op: "<=", threshold: 120, weight: 4}   # first guess
  - {id: contacts, label: No contact with staff or patients, metric: contacts, op: "==", threshold: 0, weight: 2}
  - {id: distance, label: Keeps clear of people, metric: min_distance_m, op: ">=", threshold: 0.5, weight: 1}   # first guess
  - {id: speed, label: Slow near people, metric: max_speed_near_people_mps, op: "<=", threshold: 0.8, weight: 1}   # first guess
  - {id: forbidden, label: Stays out of forbidden areas, metric: forbidden_area_entries, op: "==", threshold: 0, weight: 2}
ladder:
  0: "Lets the robot tackle the fire and carries on moving patients. [adapted from trust_dynamics.md section 2, stage 0; Robinette 2016]"
  1: "Glances back to check the fire is actually going down before leaving it. [adapted from trust_dynamics.md section 2, stage 1]"
  2: "Grabs an extinguisher themself while the robot works, and does the critical part by hand. [adapted from Dietvorst 2018, trust_dynamics.md section 2, stage 2]"
  3: "Tells the robot to stand back and calls the fire team or a colleague. [adapted from trust_dynamics.md section 2, stage 3]"
  4: "Pushes past or blocks the robot and ignores it entirely. [adapted from Mutlu 2008, trust_dynamics.md section 2, stage 4]"
sources: [Robinette 2016, Dietvorst 2018, Mutlu 2008, HTM 05-02, trust_dynamics.md section 2, scenarios.md section 4]
