id: visiting_rush
title: Visiting rush
summary: Visiting hours start as the robot sets off for the nurse base. Groups arrive as it sets off, a third of the
  way and past halfway along the corridor. The robot should give way and keep a walking pace.
steps:
- wait_until: {label: The robot sets off for the nurse base, when: {robot_moved: 1}, timeout_s: 60}
- fire: {id: b1, card: arrival, label: A first group arrives}
- wait_until: {label: The robot is a third of the way along the corridor, when: {robot_moved: 5}, timeout_s: 60}
- fire: {id: b2, card: arrival, label: A second group arrives}
- wait_until: {label: The robot is past halfway along the corridor, when: {robot_moved: 10}, timeout_s: 90}
- fire: {id: b3, card: arrival, label: A third group arrives}
- expect: {label: The robot gets most of the way to the nurse base, when: {robot_moved: 15.5}, timeout_s: 300}
