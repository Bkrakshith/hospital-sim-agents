id: evacuation_guide
title: Evacuation guide
summary: The fire alarm sounds in the lobby once the scene is under way. At the same moment a fire at the main entrance
  blocks that way out, and one person freezes. The robot should get everyone out the other way, including the patient
  in A&E waiting, and help the person who froze.
steps:
- wait_until: {label: The scene is under way (the robot has spoken to someone), when: {robot_spoke_to: anyone},
    timeout_s: 45}
- parallel:
    label: The fire alarm sounds and a fire at the main entrance blocks that way out
    branches:
    - - fire: {id: b1, card: alarm, params: {x: 0.0, y: 1.0}, label: The fire alarm sounds}
    - - fire: {id: b2, card: fire_start, params: {x: -1.24, y: -2.3}, label: A fire starts at the main entrance}
    - - fire: {id: b2b, card: route_blocked, params: {x: -4.2, y: -2.6}, label: The way out is blocked (west)}
    - - fire: {id: b2c, card: route_blocked, params: {x: -1.2, y: -2.6}, label: The way out is blocked (centre)}
    - - fire: {id: b2d, card: route_blocked, params: {x: 1.8, y: -2.6}, label: The way out is blocked (east)}
- parallel:
    label: Everyone gets out
    branches:
    - - wait_until: {label: V2 is on the move, when: {posture: {person: V2, is: walking}}, timeout_s: 20}
      - fire: {id: b3, card: freeze, target: V2, label: V2 freezes}
      - expect:
          label: The robot helps V2
          when: {any: [{robot_spoke_to: {person: V2, since_step: true}},
                       {robot_did: {action: guide, about: V2, since_step: true}}]}
          timeout_s: 90
    - - expect:
          label: The robot gets V1 and V2 out of the lobby
          when: {all: [{any: [{robot_did: {action: guided, about: V1, since_step: true}},
                              {all: [{robot_spoke_to: {person: V1, since_step: true}},
                                     {not_in_room: {person: V1, room: Lobby}}]}]},
                       {robot_did: {action: guided, about: V2, since_step: true}}]}
          timeout_s: 300
    - - expect:
          label: The robot gets P1 out of A&E waiting
          when: {robot_did: {action: guided, about: P1, since_step: true}}
          timeout_s: 400
