id: ward_fire
title: Ward fire
summary: A small fire starts in the ward corridor, the alarm follows and the nurses start moving patients. The robot
  should put the fire out without getting in the way.
steps:
- wait: {seconds: 30}
- fire: {id: b1, card: fire_start, params: {x: 19.0, y: 14.5}, label: A fire starts in the corridor}
- wait: {seconds: 20}
- fire: {id: b2, card: alarm, params: {x: 19.0, y: 14.5}, label: The alarm sounds}
- wait: {seconds: 10}
- parallel:
    label: The nurses evacuate patients
    branches:
    - - fire: {id: b3, card: staff_evacuate, target: N1, label: N1 starts moving patients}
    - - fire: {id: b4, card: staff_evacuate, target: N2, label: N2 starts moving patients}
- expect: {label: The robot puts the fire out, when: {fire_out: true}, timeout_s: 180}
