id: ward_fire
title: Ward fire
summary: A small fire starts in the ward corridor; the alarm sounds and the nurses start moving patients at once. The
  robot should put the fire out without getting in the way.
steps:
- wait: {seconds: 30}
- parallel:
    label: A fire starts in the corridor, the alarm sounds and the nurses evacuate patients
    branches:
    - - fire: {id: b1, card: fire_start, params: {x: 19.0, y: 14.5}, label: A fire starts in the corridor}
    - - fire: {id: b2, card: alarm, params: {x: 19.0, y: 14.5}, label: The alarm sounds}
    - - fire: {id: b3, card: staff_evacuate, target: N1, label: N1 starts moving patients}
    - - fire: {id: b4, card: staff_evacuate, target: N2, label: N2 starts moving patients}
- expect:
    label: The robot puts the fire out
    when: {all: [{fire_out: true}, {robot_did: {action: extinguish, since_step: true}}]}
    timeout_s: 180
