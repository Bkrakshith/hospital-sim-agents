<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WardZero Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230b5cad'/%3E%3Cpath d='M12 6v12M6 12h12' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/studio.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/scene" aria-label="WardZero Studio">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="var(--accent)"/><path d="M12 6v12M6 12h12" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span>WardZero <b>Studio</b></span>
  </a>
  <div class="project-switch">
    <label class="sr" for="project-select">Project</label>
    <select id="project-select"></select>
    <button class="icon-btn" id="project-menu-btn" aria-haspopup="menu" aria-expanded="false" title="Project actions">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
    <div class="menu" id="project-menu" role="menu" hidden>
      <button role="menuitem" data-act="new">New project</button>
      <button role="menuitem" data-act="rename">Rename</button>
      <button role="menuitem" data-act="delete" class="danger">Delete project</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Studio steps"></nav>
  <div class="cost" id="cost" hidden aria-live="polite">
    <span id="cost-text"></span><span id="cost-tokens" class="tokens"></span><span class="meter" aria-hidden="true"><i id="cost-bar"></i></span>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script src="/static/api.js"></script>
<script src="/static/map.js"></script>
<script src="/static/studio.js"></script>
<script src="/static/pages/scene.js"></script>
<script src="/static/pages/robot.js"></script>
<script src="/static/pages/run.js"></script>
<script src="/static/pages/report.js"></script>
<script>WZ.start();</script>
</body>
</html>
